[project]
name = "webhook-service"
version = "0.1.0"
description = "Multi-tenant webhook delivery service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "orjson>=3.10",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-logging>=0.48b0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27",
    "prometheus-fastapi-instrumentator>=7.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "aiokafka>=0.12",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest-cov>=6.0",
    "testcontainers[postgres,redis,kafka]>=4.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
# The repo has a local `alembic/` migrations directory, so isort would
# otherwise classify the `alembic` package itself as first-party.
known-third-party = ["alembic"]
known-first-party = ["webhook_service"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Session-scoped loop: the engine and its connection pool are session-scoped,
# and a pool outliving the loop it was created on tears down against a closed
# loop ("Event loop is closed") at the end of the run.
asyncio_default_fixture_loop_scope = "session"
# Tests share that same loop — a test on its own loop touching the
# session-scoped pool hits "attached to a different loop".
asyncio_default_test_loop_scope = "session"
# `integration` marks tests that need Docker (testcontainers). Run just the
# fast suite with: pytest -m "not integration"
markers = [
    "integration: requires Docker-backed infrastructure (Postgres/Redis/Kafka)",
]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["src/webhook_service"]
branch = true
omit = ["*/__pycache__/*"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]
show_missing = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/webhook_service"]
