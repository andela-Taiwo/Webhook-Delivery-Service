apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook-backend
  namespace: webhook-service
  labels:
    app.kubernetes.io/name: webhook-backend
    app.kubernetes.io/part-of: webhook-delivery-service
spec:
  replicas: 3
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: webhook-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: webhook-backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      # Spread replicas across nodes/zones so a single node loss doesn't
      # take out the whole delivery path.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: webhook-backend
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: webhook-backend:0.1.0
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: webhook-backend-config
            - secretRef:
                name: webhook-backend-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          # Give in-flight webhook deliveries a chance to finish before the
          # pod is killed on rolling deploys.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
      terminationGracePeriodSeconds: 30
